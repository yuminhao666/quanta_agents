[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quanta-agents"
version = "0.1.0"
description = "Evidence-driven data pipelines and research agents for Quanta Research Memory."
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27.0",
  "jsonschema>=4.22.0",
  "pydantic>=2.7.0",
  "python-dotenv>=1.0.1",
  "PyYAML>=6.0.2"
]

[project.optional-dependencies]
crawler = [
  "beautifulsoup4>=4.12.3",
  "lxml>=5.2.1",
  "readability-lxml>=0.8.1"
]
documents = [
  "openpyxl>=3.1.5",
  "pandas>=2.2.2",
  "pdfplumber>=0.11.0"
]
llm = [
  "openai>=1.84.0"
]
dev = [
  "pytest>=8.2.0",
  "ruff>=0.5.0"
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
