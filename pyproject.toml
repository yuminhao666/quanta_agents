[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quanta-agents"
version = "0.1.0"
description = "Evidence-driven data pipelines and research agents for Quanta Research Memory."
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27.0",
  "jsonschema>=4.22.0",
  "pydantic>=2.7.0",
  "python-dotenv>=1.0.1",
  "PyYAML>=6.0.2"
]

[project.scripts]
quanta-opinion-radar-export = "quanta_agents.opinion_radar.export:main"
quanta-opinion-radar-news-logic = "quanta_agents.opinion_radar.news_logic:main"
quanta-opinion-radar-report = "quanta_agents.opinion_radar.report:main"
quanta-futures-daily-import = "quanta_agents.futures_daily.importer:main"
quanta-futures-daily-oss-sync = "quanta_agents.futures_daily.oss_sync:main"
quanta-futures-daily-raw-ingest = "quanta_agents.futures_daily.raw_ingest:main"
quanta-futures-daily-run-raw = "quanta_agents.futures_daily.raw_run:main"
quanta-asset-taxonomy-bootstrap = "quanta_agents.core.taxonomy_bootstrap:main"
quanta-analysis-framework-registry = "quanta_agents.core.analysis_framework:main"
quanta-framework-audit = "quanta_agents.core.framework_audit:main"
quanta-framework-weight-optimize = "quanta_agents.core.framework_weight_optimizer:main"
quanta-futures-daily-align = "quanta_agents.futures_daily.framework_alignment:main"
quanta-futures-daily-logic-chain = "quanta_agents.futures_daily.logic_chain:main"
quanta-futures-daily-logic-evolution = "quanta_agents.futures_daily.logic_evolution:main"
quanta-wechat-research-evidence = "quanta_agents.research_reports.wechat_evidence:main"
quanta-wechat-canonical-evidence-bridge = "quanta_agents.research_reports.wechat_canonical_bridge:main"
quanta-polymarket-daily = "quanta_agents.polymarket_daily.export:main"

[project.optional-dependencies]
crawler = [
  "beautifulsoup4>=4.12.3",
  "lxml>=5.2.1",
  "readability-lxml>=0.8.1"
]
documents = [
  "openpyxl>=3.1.5",
  "pandas>=2.2.2",
  "pdfplumber>=0.11.0"
]
llm = [
  "openai>=1.84.0"
]
radar = [
  "pymysql>=1.0"
]
oss = [
  "oss2>=2.18.6"
]
dev = [
  "pytest>=8.2.0",
  "ruff>=0.5.0"
]

[tool.setuptools.packages.find]
include = ["quanta_agents*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
